[package]
name = "sedge"
publish = false
version = "0.1.0"
description = "Sedge, the overload harness for deployed Hydro programs: drives a program through a baseline-trigger-recovery load profile in wall-clock time and reports whether it recovers."
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[features]
stageleft_macro_entrypoint = ["hydro_lang/stageleft_macro_entrypoint"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.82"
async-trait = "0.1.54"
futures = "0.3.0"
hydro_deploy = { path = "../hydro_deploy/core", version = "=0.17.0-alpha.3" }
hydro_deploy_integration = { path = "../hydro_deploy/hydro_deploy_integration", version = "^0.17.0-alpha.2" }
hydro_lang = { path = "../hydro_lang", version = "=0.17.0-alpha.4", default-features = false, features = ["tokio", "deploy"] }
rand = "0.10"
sedge_macro = { path = "../sedge_macro", version = "^0.1.0" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
stageleft.workspace = true
tokio = { version = "1.29.0", features = ["time", "sync", "rt", "rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.3", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }

[build-dependencies]
stageleft_tool.workspace = true
