[package]
name = "consensus_gauntlet"
publish = false
version = "0.0.0"
edition = { workspace = true }

[lints]
workspace = true

[features]
default = []
# Builds the target-neutral Hydro benchmark graph and localhost executor.
deploy = ["dep:tokio"]
# Exports the same graph as a Hydro ECS manifest. Hydro's ECS backend is
# export-only; an external orchestrator launches tasks and returns their logs.
ecs = ["deploy", "hydro_lang/ecs_deploy"]
# Executes the external lin-kv checker with Hydro's Maelstrom deployment.
maelstrom = ["deploy", "hydro_lang/maelstrom"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
stageleft.workspace = true
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
hydro_deploy = { path = "../hydro_deploy/core", version = "^0.17.0-alpha.3" }
hydro_lang = { path = "../hydro_lang", version = "^0.17.0-alpha.4", default-features = false, features = ["deploy"] }
hydro_std = { path = "../hydro_std", version = "^0.17.0-alpha.4", default-features = false, features = ["tokio"] }
hydro_test = { path = "../hydro_test", version = "^0.0.0", default-features = false, features = ["tokio"] }
hdrhistogram = { version = "7.5.4" }
tokio = { version = "1.29.0", features = ["full"], optional = true }

[[test]]
name = "compare_smoke"
required-features = ["deploy"]

[build-dependencies]
stageleft_tool.workspace = true

[dev-dependencies]
tempfile = "3"
